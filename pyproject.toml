[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-pipeline-audit"
version = "0.1.0"
description = "Order data pipeline with run audit and lineage reporting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
order-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]